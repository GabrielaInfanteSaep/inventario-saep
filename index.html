<title>Control de Inventarios</title>

<style>
:root{
  --brand:#FC8041; --brand-hover:#E86B2C; --brand-pale:#FFF2E6;
  --bg:#F8F9FA; --surface:#FFFFFF;
  --text:#2C2E33; --text-secondary:#70757E;
  --border:#DCE0E5;
  --steel:#4A6C8C; --steel-pale:#EAF0F5;
  --red:#D92D20; --red-bg:#FEF3F2;
  --amber:#DC6803; --amber-bg:#FFFAEB;
  --green:#1A7F37; --green-bg:#ECFDF3;
  --radius:8px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
header{background:var(--surface);color:var(--text);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border);}
header h1{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:9px;}
header h1 img{height:26px;width:auto;display:block;}
header .status{font-size:12px;color:var(--text-secondary);}
nav{background:var(--surface);display:flex;overflow-x:auto;position:sticky;top:49px;z-index:19;border-bottom:1px solid var(--border);}
nav button{background:none;border:none;color:var(--text-secondary);padding:12px 16px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500;}
nav button:hover{color:var(--brand);}
nav button.active{color:var(--brand);border-bottom:3px solid var(--brand);font-weight:700;}
main{padding:16px;max-width:1200px;margin:0 auto;padding-bottom:60px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.card .label{font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
.card .value{font-size:22px;font-weight:700;color:var(--text);}
.card .kpi-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;}
.card.alert{border-color:#FDA29B;}
.card.alert .value{color:var(--red);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.panel h2{font-size:15px;margin:0 0 12px;color:var(--text);font-weight:700;}
.panel.alert-panel{border:1px solid #FDA29B;background:var(--red-bg);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
input,select,textarea{border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand);}
button.btn{background:var(--brand);color:#fff;border:none;border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600;}
button.btn:hover{background:var(--brand-hover);}
button.btn.secondary{background:var(--surface);color:var(--steel);border:1px solid var(--border);}
button.btn.secondary:hover{background:var(--steel-pale);border-color:var(--steel);}
button.btn.danger{background:var(--red-bg);color:var(--red);border:1px solid #FDA29B;}
button.btn.sm{padding:5px 9px;font-size:12px;}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface);}
thead th{position:sticky;top:0;background:var(--bg);color:var(--text);text-align:left;padding:10px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--brand-pale);}
.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:6px;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.faltante{background:var(--red-bg);color:var(--red);}
.badge.sobrante{background:var(--amber-bg);color:var(--amber);}
.badge.cuadrado{background:var(--green-bg);color:var(--green);}
.badge.pendiente{background:var(--amber-bg);color:var(--amber);}
.badge.mapeado{background:var(--green-bg);color:var(--green);}
.badge.critico{background:var(--red-bg);color:var(--red);}
tr.row-faltante{background:var(--red-bg);}
tr.row-sobrante{background:var(--amber-bg);}
tr.row-cuadrado{background:var(--green-bg);}
.search{flex:1;min-width:200px;}
.hint{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.hidden{display:none !important;}
.count-input{width:90px;font-size:16px;padding:8px;text-align:center;}
label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:3px;}
.field{display:flex;flex-direction:column;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
.bar-label{width:170px;flex-shrink:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;background:var(--bg);border-radius:5px;height:11px;overflow:hidden;border:1px solid var(--border);}
.bar-fill{height:100%;background:var(--brand);border-radius:5px 0 0 5px;}
.bar-val{width:56px;text-align:right;font-weight:700;flex-shrink:0;}
.activity-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.list-row:last-child{border-bottom:none;}
.list-row .list-main{flex:1;min-width:220px;}
.list-row .list-title{font-weight:700;font-size:13.5px;color:var(--text);}
.list-row .list-meta{font-size:12px;color:var(--text-secondary);margin-top:3px;}
.list-row .list-side{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.list-row .list-qty{font-weight:700;font-size:15px;min-width:46px;text-align:right;}
.activity-item:last-child{border-bottom:none;}
.activity-item .side{color:var(--text-secondary);white-space:nowrap;}
.scan-box{background:var(--brand-pale);border:2px dashed var(--brand);border-radius:8px;padding:16px;text-align:center;}
.scan-box.found{background:var(--green-bg);border:1px solid var(--green);border-style:solid;text-align:left;}
.big-input{font-size:20px;padding:12px;width:100%;text-align:center;letter-spacing:1px;}
.chip{display:inline-block;background:var(--steel-pale);color:var(--steel);font-size:11px;padding:2px 8px;border-radius:12px;margin-left:6px;font-weight:600;}
.section-tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);font-weight:700;margin-bottom:4px;}
@media(max-width:640px){
  .table-wrap{max-height:70vh;}
  main{padding:10px;}
  .bar-label{width:110px;}
  /* En pantallas angostas cada fila de tabla se muestra como tarjeta apilada,
     con el nombre de la columna al lado de cada dato, en vez de scroll horizontal. */
  .table-wrap table, .table-wrap thead, .table-wrap tbody, .table-wrap th, .table-wrap td, .table-wrap tr{ display:block; width:100%; }
  .table-wrap thead{ display:none; }
  .table-wrap tr{ border:1px solid var(--border); border-radius:8px; margin:0 0 10px; padding:10px 12px; background:var(--surface); }
  .table-wrap tbody{ padding:2px; }
  .table-wrap td{ border:none; padding:5px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; white-space:normal; text-align:right; }
  .table-wrap td::before{ content: attr(data-label); font-weight:700; color:var(--text-secondary); font-size:11px; text-transform:uppercase; letter-spacing:.03em; text-align:left; }
  .table-wrap td:empty{ display:none; }
}
</style>
</head>

async function loadAll(){
  const keys = ['maestro','entradas','salidas','alias','cortes','conteos'];
  let existiaMaestro = false;
  if(supabaseClient){
    try{
      const { data, error } = await supabaseClient.from('app_storage').select('key,value');
      if(error) throw error;
      const map = {};
      (data||[]).forEach(row=>{ map[row.key] = row.value; });
      for(const k of keys){
        if(map[k]!==undefined){ DB[k] = map[k]; if(k==='maestro') existiaMaestro = true; }
      }
    }catch(e){
      console.error('Error leyendo Supabase:', e);
      const detalle = (e && (e.message || e.error_description || e.hint || e.details)) || '';
      document.getElementById('statusMsg').textContent = '⚠ Error de conexión a Supabase' + (detalle?(': '+detalle):'');
    }
  } else {
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value!==undefined){
          DB[k] = JSON.parse(r.value);
          if(k==='maestro') existiaMaestro = true;
        }
      }catch(e){ /* clave no existe todavía */ }
    }
  }
  if(!existiaMaestro && typeof SEED_DATA!=='undefined'){
    // Primera vez que se abre esta app con esta conexión: se precarga con los
    // datos ya procesados de tus 4 archivos y se guarda de una vez.
    DB = JSON.parse(JSON.stringify(SEED_DATA));
    for(const k of keys){ await save(k); }
  }
}
async function save(key){
  try{
    if(supabaseClient){
      const { error } = await supabaseClient.from('app_storage').upsert({key, value: DB[key], updated_at: new Date().toISOString()}, {onConflict:'key'});
      if(error) throw error;
      document.getElementById('statusMsg').textContent = 'Guardado en Supabase (compartido con el equipo)';
    } else {
      await window.storage.set(key, JSON.stringify(DB[key]), true);
      document.getElementById('statusMsg').textContent = 'Guardado (compartido con el equipo)';
    }
  }catch(e){
    // Se muestra el motivo real del error (no solo "Error al guardar") para poder
    // diagnosticarlo: suele ser un tema de permisos/políticas en Supabase.
    const detalle = (e && (e.message || e.error_description || e.hint || e.details)) || JSON.stringify(e);
    document.getElementById('statusMsg').textContent = '⚠ Error al guardar: ' + detalle;
    console.error('Error al guardar en', key, e);
  }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
// fFecha(): convierte una fecha guardada como "aaaa-mm-dd" a texto "dd-mm-aaaa"
// para mostrarla en listas, tablas y tarjetas. Los <input type="date"> siempre
// guardan y reciben internamente en formato aaaa-mm-dd (estándar HTML) —
// el formato que el navegador MUESTRA en el selector de calendario depende
// de la configuración regional del sistema operativo/navegador de cada
// persona y no se puede forzar al 100% desde la página.
function fFecha(iso){
  if(!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return iso;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function fmtMoney(n){ return '$'+Math.round(n||0).toLocaleString('es-CL'); }
// norm(): usado para comparar SKUs, textos de búsqueda y el nombreCompleto entre archivos.
// Colapsa espacios repetidos (los archivos traen dobles espacios de forma inconsistente).
function norm(s){ return (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase(); }
// normHeader(): usado SOLO para reconocer encabezados de columnas de Excel sin importar
// tildes, guiones bajos, espacios o dos puntos ("Solicitud de:" == "Solicitud_de").
function normHeader(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function get(row, ...keys){
  const entries = Object.keys(row).map(k=>({orig:k, n:normHeader(k)}));
  for(const cand of keys){
    const cn = normHeader(cand);
    const hit = entries.find(e=>e.n===cn);
    if(hit) return row[hit.orig];
  }
  return '';
}
function parseFecha(raw){
  if(raw instanceof Date && !isNaN(raw)) return raw.toISOString().slice(0,10);
  const s = (raw||'').toString().trim();
  if(!s) return todayStr();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const d = new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return todayStr();
}
// getStr(): igual que get(), pero limpia valores basura típicos de Excel (errores
// de fórmula como #N/A, o el texto literal "NA") para que nunca se muestren en la app.
function getStr(row, ...keys){
  const v = get(row, ...keys).toString().trim();
  if(/^#?n\/?a$/i.test(v)) return '';
  return v;
}
function getProducto(sku){ return DB.maestro.find(m=>m.sku===sku); }
function productoLabel(m){ if(!m) return ''; return m.nombrePrenda || m.nombreCompleto || 'Producto sin nombre'; }
function tallaLabel(m){ return (m && m.talla) ? m.talla : '—'; }
// Resuelve el SKU a partir del texto de "nombre completo" que traen los archivos de
// Kizeo o de facturas, comparando contra el maestro (y contra alias aprendidos antes).
function resolveSkuByNombre(texto){
  const key = norm(texto);
  if(!key) return null;
  if(DB.alias[key]) return DB.alias[key];
  const found = DB.maestro.find(m=>norm(m.nombreCompleto)===key);
  return found ? found.sku : null;
}
function resolveSkuByBarra(barra){
  const b = (barra||'').toString().trim();
  if(!b) return null;
  const found = DB.maestro.find(m=>(m.codigoBarra||'').toString().trim()===b);
  return found ? found.sku : null;
}
function guardarAlias(texto, sku){
  const key = norm(texto);
  if(key) DB.alias[key] = sku;
}

function stockAntesDe(sku, fechaISO){
  const base = Number((getProducto(sku)||{}).stockInicial||0);
  const ent = DB.entradas.filter(e=>e.sku===sku && e.fecha < fechaISO).reduce((a,e)=>a+Number(e.cantidad),0);
  const sal = DB.salidas.filter(s=>s.sku===sku && s.fecha < fechaISO).reduce((a,s)=>a+Number(s.cantidad),0);
  return base + ent - sal;
}
function stockActual(sku){
  const base = Number((getProducto(sku)||{}).stockInicial||0);
  const ent = DB.entradas.filter(e=>e.sku===sku).reduce((a,e)=>a+Number(e.cantidad),0);
  const sal = DB.salidas.filter(s=>s.sku===sku).reduce((a,s)=>a+Number(s.cantidad),0);
  return base + ent - sal;
}

// el(): convierte un string de HTML en un elemento real. OJO: si el HTML es
// una fila <tr>...</tr>, el navegador IGNORA las etiquetas <tr>/<td> cuando se
// insertan dentro de un <div> normal (regla del parser HTML), y el contenido
// se pierde o queda incompleto. Por eso, para filas de tabla, se arma dentro
// de un <table><tbody> temporal, que sí es un contexto válido.
function el(html){
  html = html.trim();
  if(/^<tr[\s>]/i.test(html)){
    const t = document.createElement('table');
    t.innerHTML = '<tbody>'+html+'</tbody>';
    return t.querySelector('tr');
  }
  const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild;
}
function escapeHtml(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Sugiere el siguiente SKU y código de barra en base al último producto
// agregado al maestro (mayor número encontrado), para no tener que inventar
// uno manualmente cada vez.
function siguienteSku(){
  let maxNum = 0, prefix = 'SKU-', pad = 5, encontrado = false;
  DB.maestro.forEach(m=>{
    const match = (m.sku||'').match(/^(.*?)(\d+)$/);
    if(match){
      const num = parseInt(match[2],10);
      if(num > maxNum){ maxNum = num; prefix = match[1]; pad = match[2].length; encontrado = true; }
    }
  });
  if(!encontrado) return '';
  return prefix + (maxNum+1).toString().padStart(pad,'0');
}
function siguienteBarra(){
  let maxNum = 0, len = 13;
  DB.maestro.forEach(m=>{
    const b = (m.codigoBarra||'').toString().trim();
    if(/^\d+$/.test(b)){
      const num = parseInt(b,10);
      if(num > maxNum){ maxNum = num; len = b.length; }
    }
  });
  if(maxNum===0) return '';
  return (maxNum+1).toString().padStart(len,'0');
}

      wrap.innerHTML = `<div class="hint">${parsed.length} filas leídas · ${nuevos.length} nuevas · ${existentes.length} ya existen (se omitirán si confirmas). ${parsed.length - nuevos.length - existentes.length>0?'Algunas filas no tenían Código o Nombre_Completo y se ignoraron.':''}</div>
        <div class="table-wrap" style="max-height:300px;"><table>
          <thead><tr><th>SKU</th><th>Nombre completo</th><th>Stock inicial</th><th>Precio</th><th></th></tr></thead>
          <tbody>${parsed.slice(0,300).map(p=>`<tr><td>${escapeHtml(p.sku)}</td><td>${escapeHtml(p.nombreCompleto)}</td><td>${p.stockInicial}</td><td>${fmtMoney(p.precioNeto)}</td><td>${DB.maestro.some(m=>m.sku===p.sku)?'<span class="badge pendiente">ya existe</span>':'<span class="badge mapeado">nuevo</span>'}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="row" style="margin-top:10px;"><button class="btn" id="bulkConfirm">Confirmar e importar ${nuevos.length} productos nuevos</button></div>`;
      wrap.querySelector('#bulkConfirm').onclick = ()=>{
        DB.maestro.push(...nuevos);
        save('maestro');
        render();
      };
    };
    reader.readAsArrayBuffer(file);
  };

  const tablePanel = el(`<div class="panel">
    <h2>Maestro de productos (${DB.maestro.length})</h2>
    <div class="row"><input class="search" id="maeSearch" placeholder="Buscar por SKU, producto, proveedor o código de barra..."></div>
    <div class="table-wrap"><table>
      <thead><tr><th>SKU</th><th>Cód. barra</th><th>Producto</th><th>Talla</th><th>Proveedor</th><th>Precio</th><th>Stock crít.</th><th>Stock actual</th><th></th></tr></thead>
      <tbody id="maeBody"></tbody>
    </table></div>
  </div>`);
  main.appendChild(tablePanel);

  function fill(filter){
    const tbody = tablePanel.querySelector('#maeBody');
    tbody.innerHTML='';
    const f = norm(filter);
    DB.maestro.filter(m=>!f||norm(m.sku).includes(f)||norm(m.nombrePrenda).includes(f)||norm(m.nombreCompleto).includes(f)||norm(m.proveedor).includes(f)||norm(m.codigoBarra).includes(f))
      .forEach(m=>{
        const st = stockActual(m.sku);
        const crit = st<=Number(m.stockCritico||0);
        tbody.appendChild(el(`<tr class="${crit?'row-faltante':''}">
          <td data-label="SKU">${escapeHtml(m.sku)}</td><td data-label="Cód. barra">${escapeHtml(m.codigoBarra)||'—'}</td><td data-label="Producto">${escapeHtml(productoLabel(m))}</td><td data-label="Talla">${escapeHtml(tallaLabel(m))}</td>
          <td data-label="Proveedor">${escapeHtml(m.proveedor)}</td><td data-label="Precio">${fmtMoney(m.precioNeto)}</td>
          <td data-label="Stock crít.">${m.stockCritico||0}</td><td data-label="Stock actual"><strong>${st}</strong></td>
          <td data-label=""><button class="btn danger sm" data-sku="${escapeHtml(m.sku)}">Eliminar</button></td>
        </tr>`));
      });
    tbody.querySelectorAll('button[data-sku]').forEach(b=>{
      b.onclick = ()=>{
        const m = getProducto(b.dataset.sku);
        if(!confirm(`¿Eliminar definitivamente "${productoLabel(m)}" (${b.dataset.sku}) del maestro? También se perderá el historial de entradas/salidas asociado a este SKU. Esta acción no se puede deshacer.`)) return;
        if(!checkAdmin()) return;
        DB.maestro = DB.maestro.filter(m=>m.sku!==b.dataset.sku);
        save('maestro'); render();
      };
    });
  }
  fill('');
  tablePanel.querySelector('#maeSearch').addEventListener('input', e=>fill(e.target.value));

  panel.querySelector('#mAdd').onclick = ()=>{
    const sku = panel.querySelector('#mSku').value.trim();
    const nombreCompleto = panel.querySelector('#mNombreCompleto').value.trim();
    if(!sku || !nombreCompleto){ alert('SKU y Nombre completo son obligatorios'); return; }
    if(DB.maestro.some(m=>m.sku===sku)){ alert('Ya existe un producto con ese SKU'); return; }
    DB.maestro.push({
      sku,
      codigoBarra: panel.querySelector('#mBarra').value.trim(),
      nombreCompleto,
      nombrePrenda: panel.querySelector('#mNombre').value.trim(),
      proveedor: panel.querySelector('#mProveedor').value.trim(),
      talla: panel.querySelector('#mTalla').value.trim(),
      precioNeto: Number(panel.querySelector('#mPrecio').value||0),
      stockCritico: Number(panel.querySelector('#mCritico').value||0),
      stockInicial: Number(panel.querySelector('#mStockInicial').value||0)
    });
    save('maestro'); render();
  };
  panel.querySelector('#mExport').onclick = ()=>{
    const ws = XLSX.utils.json_to_sheet(DB.maestro);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Maestro_Prod');
    XLSX.writeFile(wb, 'maestro_productos.xlsx');
  };
}

// ---------------------------------------------------------------
// ENTRADAS
// ---------------------------------------------------------------
function renderEntradas(main){
  // --- Panel 1: lector de código de barra ---
  const scanPanel = el(`<div class="panel">
    <div class="section-tag">Registro rápido</div>
    <h2>📷 Lector de código de barra</h2>
    <div class="row">
      <div class="field"><label>Fecha de la entrada</label><input type="date" id="scanFecha" lang="es-CL" value="${todayStr()}"></div>
      <div class="field" style="flex:1;min-width:180px;"><label>N° Factura (opcional, aplica a todo el lote)</label><input id="scanFactura"></div>
    </div>
    <div class="scan-box" id="scanBoxOuter">
      <label style="font-size:13px;">Escanea el código de barra de la hoja impresa (o escríbelo) y presiona Enter</label>
      <input id="scanBarra" class="big-input" placeholder="Código de barra..." autocomplete="off">
      <div class="row" style="justify-content:center;margin-top:10px;margin-bottom:0;">
        <button class="btn secondary" id="scanCamBtn">📸 Escanear con la cámara del teléfono</button>
      </div>
      <div id="scanCamWrap" style="margin-top:10px;"></div>
    </div>
    <div id="scanPendingWrap" style="margin-top:10px;"></div>
    <div id="scanNotFound"></div>
    <div class="table-wrap" style="margin-top:10px;"><table>
      <thead><tr><th>Producto</th><th>Talla</th><th>Proveedor</th><th>Cantidad</th><th></th></tr></thead>
      <tbody id="scanLinesBody"></tbody>
    </table></div>
    <div class="row" style="margin-top:10px;"><button class="btn" id="scanRegistrar">Registrar entradas del lote (<span id="scanCount">0</span>)</button></div>
    <div class="hint">Un lector físico USB o Bluetooth funciona automáticamente: escribe como si fuera un teclado, así que solo tienes que hacer clic en el cuadro de arriba y disparar el lector. También puedes usar la cámara del teléfono con el botón "Escanear con la cámara" (funciona mejor en Chrome/Android; en iPhone puede no estar disponible según la versión de iOS).</div>
  </div>`);
  main.appendChild(scanPanel);

  let scanLines = [];
  let lastProveedor = '';
  const scanBarra = scanPanel.querySelector('#scanBarra');

  // --- Escaneo con cámara (usa la API nativa BarcodeDetector del navegador; no
  // requiere ninguna librería externa). Si el navegador no la soporta, se avisa. ---
  let camStream = null;
  const camBtn = scanPanel.querySelector('#scanCamBtn');
  const camWrap = scanPanel.querySelector('#scanCamWrap');
  function detenerCamara(){
    if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
    camWrap.innerHTML='';
    camBtn.textContent = '📸 Escanear con la cámara del teléfono';
  }
  camBtn.onclick = async ()=>{
    if(camStream){ detenerCamara(); return; }
    if(!('BarcodeDetector' in window)){
      camWrap.innerHTML = `<div class="hint" style="color:var(--red);">Este navegador no soporta escaneo por cámara todavía. Prueba con Chrome en Android, o usa un lector físico de código de barra.</div>`;
      return;
    }
    try{
      camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    }catch(err){
      camWrap.innerHTML = `<div class="hint" style="color:var(--red);">No se pudo acceder a la cámara (revisa los permisos del navegador).</div>`;
      return;
    }
    camBtn.textContent = '✕ Detener cámara';
    camWrap.innerHTML = `<video id="scanVideo" autoplay playsinline muted style="width:100%;max-width:420px;border-radius:8px;"></video>`;
    const video = camWrap.querySelector('#scanVideo');
    video.srcObject = camStream;
    const detector = new BarcodeDetector();
    let escaneando = true;
    async function loop(){
      if(!escaneando || !camStream) return;
      try{
        const barcodes = await detector.detect(video);
        if(barcodes.length){
          scanBarra.value = barcodes[0].rawValue;
          escaneando = false;
          detenerCamara();
          scanBarra.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter'}));
          return;
        }
      }catch(e){ /* frame no decodificable aún, se reintenta */ }
      requestAnimationFrame(loop);
    }
    loop();
  };

  function fillScanLines(){
    const tbody = scanPanel.querySelector('#scanLinesBody');
    tbody.innerHTML='';
    scanLines.forEach((l,i)=>{
      tbody.appendChild(el(`<tr>
        <td>${escapeHtml(l.nombre)}</td><td>${escapeHtml(l.talla)}</td><td>${escapeHtml(l.proveedor)}</td><td>${l.cantidad}</td>
        <td><button class="btn danger sm" data-i="${i}">Quitar</button></td>
      </tr>`));
    });
    scanPanel.querySelector('#scanCount').textContent = scanLines.length;
    tbody.querySelectorAll('button[data-i]').forEach(b=>{
      b.onclick=()=>{ scanLines.splice(Number(b.dataset.i),1); fillScanLines(); };
    });
  }

  function showPending(m){
    scanPanel.querySelector('#scanNotFound').innerHTML='';
    const wrap = scanPanel.querySelector('#scanPendingWrap');
    wrap.innerHTML = `<div class="scan-box found">
      <div style="font-weight:700;margin-bottom:8px;">${escapeHtml(productoLabel(m))} — Talla ${escapeHtml(m.talla||'—')} <span class="chip">Stock actual: ${stockActual(m.sku)}</span></div>
      <div class="row">
        <div class="field"><label>Cantidad</label><input id="pendCantidad" type="number" value="1" min="1" style="width:100px;text-align:center;"></div>
        <div class="field" style="flex:1;min-width:160px;"><label>Proveedor</label><input id="pendProveedor" value="${escapeHtml(lastProveedor||m.proveedor||'')}"></div>
        <button class="btn" id="pendAdd" style="align-self:flex-end;">Agregar a la lista</button>
        <button class="btn secondary" id="pendCancel" style="align-self:flex-end;">Cancelar</button>
      </div>
    </div>`;
    const cInput = wrap.querySelector('#pendCantidad');
    const pInput = wrap.querySelector('#pendProveedor');
    cInput.focus(); cInput.select();
    const addLine = ()=>{
      const cantidad = Number(cInput.value||0);
      if(cantidad<=0){ alert('Cantidad inválida'); return; }
      lastProveedor = pInput.value.trim();
      scanLines.push({sku:m.sku, nombre:productoLabel(m), talla:m.talla, proveedor:lastProveedor, cantidad});
      fillScanLines();
      wrap.innerHTML='';
      scanBarra.value=''; scanBarra.focus();
    };
    wrap.querySelector('#pendAdd').onclick = addLine;
    wrap.querySelector('#pendCancel').onclick = ()=>{ wrap.innerHTML=''; scanBarra.value=''; scanBarra.focus(); };
    cInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); pInput.focus(); pInput.select(); }});
    pInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addLine(); }});
  }

  scanBarra.addEventListener('keydown', (ev)=>{
    if(ev.key!=='Enter') return;
    ev.preventDefault();
    const codigo = scanBarra.value.trim();
    if(!codigo) return;
    const sku = resolveSkuByBarra(codigo);
    const m = sku ? getProducto(sku) : null;
    if(!m){
      scanPanel.querySelector('#scanPendingWrap').innerHTML='';
      scanPanel.querySelector('#scanNotFound').innerHTML = `<div class="hint" style="color:var(--red);">Código "${escapeHtml(codigo)}" no encontrado en el maestro de productos.</div>`;
      scanBarra.value=''; scanBarra.focus();
      return;
    }
    showPending(m);
    scanBarra.value='';
  });

  scanPanel.querySelector('#scanRegistrar').onclick = ()=>{
    if(!scanLines.length){ alert('No hay líneas escaneadas todavía'); return; }
    const fecha = scanPanel.querySelector('#scanFecha').value || todayStr();
    const factura = scanPanel.querySelector('#scanFactura').value.trim();
    scanLines.forEach(l=>{
      const prod = getProducto(l.sku);
      DB.entradas.push({id:uid(), fecha, sku:l.sku, nombreCompleto:(prod?prod.nombreCompleto:l.nombre), cantidad:l.cantidad, proveedor:l.proveedor, factura, observaciones:'Ingreso por lector de código de barra'});
    });
    save('entradas');
    scanLines = [];
    render();
  };

  // --- Panel 2: registro manual ---
  const datalistOptions = DB.maestro.map(m=>`<option value="${escapeHtml(m.nombreCompleto)}">`).join('');
  const panel = el(`<div class="panel">
    <h2>Registrar entrada manual</h2>
    <div class="row">
      <div class="field"><label>Fecha *</label><input id="eFecha" type="date" lang="es-CL" value="${todayStr()}"></div>
      <div class="field" style="flex:1;min-width:260px;"><label>Producto (nombre completo) *</label>
        <input id="eProducto" list="maestroProductosList" placeholder="Empieza a escribir el nombre..." autocomplete="off">
        <datalist id="maestroProductosList">${datalistOptions}</datalist>
      </div>
      <div class="field"><label>Cantidad *</label><input id="eCantidad" type="number" min="1"></div>
      <div class="field"><label>Proveedor</label><input id="eProveedor"></div>
      <div class="field"><label>N° Factura</label><input id="eFactura"></div>
    </div>
    <div class="hint" id="eSkuPreview">El SKU se asigna automáticamente comparando el nombre completo contra el maestro.</div>
    <div class="row" style="margin-top:8px;"><textarea id="eObs" placeholder="Observaciones" style="width:100%;min-height:36px;"></textarea></div>
    <div class="row"><button class="btn" id="eAdd">Registrar entrada</button></div>
    ${DB.maestro.length===0?'<div class="hint">Agrega productos al maestro antes de registrar entradas.</div>':''}
  </div>`);
  main.appendChild(panel);

  const eProducto = panel.querySelector('#eProducto');
  const eSkuPreview = panel.querySelector('#eSkuPreview');
  function actualizarPreview(){
    if(!eProducto.value.trim()){ eSkuPreview.innerHTML='El SKU se asigna automáticamente comparando el nombre completo contra el maestro.'; return; }
    const sku = resolveSkuByNombre(eProducto.value);
    eSkuPreview.innerHTML = sku
      ? `<span class="badge mapeado">SKU asignado: ${escapeHtml(sku)}</span>`
      : `<span class="badge pendiente">No se encontró en el maestro — revisa el nombre o agrégalo primero</span>`;
  }
  eProducto.addEventListener('input', actualizarPreview);

  panel.querySelector('#eAdd').onclick = ()=>{
    const fecha = panel.querySelector('#eFecha').value;
    const productoTexto = eProducto.value.trim();
    const cantidad = Number(panel.querySelector('#eCantidad').value||0);
    if(!fecha || !productoTexto || cantidad<=0){ alert('Completa fecha, producto y una cantidad válida'); return; }
    const sku = resolveSkuByNombre(productoTexto);
    if(!sku){ alert('Ese producto no coincide con ninguno del maestro. Revisa el nombre o agrégalo primero en la pestaña Maestro de productos.'); return; }
    const prod = getProducto(sku);
    DB.entradas.push({
      id: uid(), fecha, sku, nombreCompleto: prod?prod.nombreCompleto:productoTexto,
      cantidad, proveedor: panel.querySelector('#eProveedor').value.trim(),
      factura: panel.querySelector('#eFactura').value.trim(),
      observaciones: panel.querySelector('#eObs').value.trim()
    });
    save('entradas'); render();
  };

  // --- Panel 3: carga masiva desde facturas ---
  const bulkPanel = el(`<div class="panel">
    <h2>Carga masiva de entradas — Archivo de facturas</h2>
    <div class="row">
      <input type="file" id="bulkEntFile" accept=".xlsx,.xls,.csv">
      <button class="btn" id="bulkEntImport">Previsualizar</button>
      <button class="btn secondary" id="bulkEntTemplate">Descargar plantilla</button>
    </div>
    <div class="hint">Columnas reconocidas: Fecha, Proveedor, Factura, Descriptor (o Producto / Nombre_Completo), Cantidad, Bodega. El SKU se asigna comparando el nombre completo contra el maestro — no hace falta que el archivo traiga código.</div>
    <div id="bulkEntPreviewWrap"></div>
  </div>`);
  main.appendChild(bulkPanel);

  bulkPanel.querySelector('#bulkEntTemplate').onclick = ()=>{
    const ws = XLSX.utils.json_to_sheet([{Fecha:'2026-08-06',Proveedor:'Rac',Factura:259750,Descriptor:'Pantalón Cargo Gabardina F/Polar Azul   RAC T-M',Bodega:'Bodega CC',Cantidad:50,Precio:7580}]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Entradas');
    XLSX.writeFile(wb, 'plantilla_entradas.xlsx');
  };

  bulkPanel.querySelector('#bulkEntImport').onclick = ()=>{
    const file = bulkPanel.querySelector('#bulkEntFile').files[0];
    if(!file){ alert('Selecciona un archivo primero'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      const pendientesBulkEnt = [];
      let importadas = 0;
      rows.forEach(r=>{
        const fecha = parseFecha(get(r,'Fecha'));
        const nombreTxt = get(r,'Descriptor','Producto','Nombre_Completo','Nombre Completo').toString().trim();
        const cantidad = Number(get(r,'Cantidad')||0);
        const proveedor = get(r,'Proveedor').toString().trim();
        const factura = get(r,'Factura','Nro_Factura').toString().trim();
        const bodega = get(r,'Bodega').toString().trim();
        const codigoDirecto = get(r,'Codigo','SKU').toString().trim();
        if(!nombreTxt || cantidad<=0) return;
        const sku = (codigoDirecto && getProducto(codigoDirecto)) ? codigoDirecto : resolveSkuByNombre(nombreTxt);
        if(sku){
          DB.entradas.push({id: uid(), fecha, sku, nombreCompleto: nombreTxt, cantidad, proveedor, factura, observaciones: bodega?('Bodega: '+bodega):''});
          importadas++;
        } else {
          pendientesBulkEnt.push({fecha, nombreTxt, cantidad, proveedor, factura, bodega});
        }
      });
      save('entradas');
      const wrap = bulkPanel.querySelector('#bulkEntPreviewWrap');
      if(pendientesBulkEnt.length){
        const opciones = DB.maestro.map(m=>`<option value="${escapeHtml(m.sku)}">${escapeHtml(m.sku)} - ${escapeHtml(m.nombreCompleto)}</option>`).join('');
        wrap.innerHTML = `<div class="hint">${importadas} entradas importadas automáticamente · ${pendientesBulkEnt.length} sin coincidencia en el maestro — asígnalas manualmente:</div>
          <div class="table-wrap" style="max-height:300px;"><table>
            <thead><tr><th>Fecha</th><th>Producto (archivo)</th><th>Cantidad</th><th>Asignar SKU</th></tr></thead>
            <tbody>${pendientesBulkEnt.map((p,i)=>`<tr>
              <td>${p.fecha}</td><td>${escapeHtml(p.nombreTxt)}</td><td>${p.cantidad}</td>
              <td><select data-idx="${i}"><option value="">Seleccionar producto...</option>${opciones}</select></td>
            </tr>`).join('')}</tbody>
          </table></div>`;
        wrap.querySelectorAll('select[data-idx]').forEach(sel=>{
          sel.onchange = ()=>{
            const p = pendientesBulkEnt[Number(sel.dataset.idx)];
            const prod = getProducto(sel.value);
            DB.entradas.push({id: uid(), fecha:p.fecha, sku:sel.value, nombreCompleto: prod?prod.nombreCompleto:p.nombreTxt, cantidad:p.cantidad, proveedor:p.proveedor, factura:p.factura, observaciones: p.bodega?('Bodega: '+p.bodega):''});
            guardarAlias(p.nombreTxt, sel.value);
            save('entradas'); save('alias');
            sel.closest('tr').style.opacity='0.4';
            sel.disabled = true;
          };
        });
      } else {
        wrap.innerHTML = `<div class="hint">${importadas} entradas importadas correctamente, todas coincidieron con el maestro.</div>`;
      }
      render();
    };
    reader.readAsArrayBuffer(file);
  };

  // --- Panel 4: historial (formato lista, no tabla) ---
  const tablePanel = el(`<div class="panel">
    <h2>Historial de entradas (${DB.entradas.length})</h2>
    <div class="row"><input class="search" id="entSearch" placeholder="Buscar por producto, SKU o proveedor..."></div>
    <div id="entList"></div>
  </div>`);
  main.appendChild(tablePanel);

  function fillHist(filter){
    const list = tablePanel.querySelector('#entList');
    list.innerHTML='';
    const f = norm(filter);
    const filas = [...DB.entradas]
      .filter(e=>{
        if(!f) return true;
        const prod = getProducto(e.sku);
        return norm(e.sku).includes(f) || norm(prod?productoLabel(prod):e.nombreCompleto).includes(f) || norm(e.proveedor).includes(f);
      })
      .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    if(!filas.length){
      list.appendChild(el(`<div class="hint">No hay entradas que coincidan.</div>`));
    }
    filas.forEach(e=>{
      const prod = getProducto(e.sku);
      const row = el(`<div class="list-row">
        <div class="list-main">
          <div class="list-title">${escapeHtml(prod?productoLabel(prod):e.nombreCompleto)} ${prod&&prod.talla?`<span class="chip">${escapeHtml(prod.talla)}</span>`:''}</div>
          <div class="list-meta">${fFecha(e.fecha)} · SKU ${escapeHtml(e.sku||'—')}${e.proveedor?(' · Proveedor: '+escapeHtml(e.proveedor)):''}${e.factura?(' · Factura: '+escapeHtml(e.factura)):''}</div>
        </div>
        <div class="list-side">
          <span class="list-qty" style="color:var(--green)">+${e.cantidad}</span>
          <button class="btn secondary sm" data-id="${e.id}" title="Elimina este movimiento de entrada. Úsalo solo si se registró por error.">Eliminar</button>
        </div>
      </div>`);
      list.appendChild(row);
    });
    list.querySelectorAll('button[data-id]').forEach(b=>{
      b.onclick=()=>{
        const e = DB.entradas.find(x=>x.id===b.dataset.id);
        const prod = getProducto(e.sku);
        if(!confirm(`¿Eliminar esta entrada?\n\n${fFecha(e.fecha)} · ${prod?productoLabel(prod):e.nombreCompleto} · Cantidad: ${e.cantidad}\n\nEsto restará ${e.cantidad} unidades del stock actual de ese producto. Úsalo solo si se registró por error.`)) return;
        DB.entradas = DB.entradas.filter(x=>x.id!==b.dataset.id); save('entradas'); render();
      };
    });
  }
  fillHist('');
  tablePanel.querySelector('#entSearch').addEventListener('input', e=>fillHist(e.target.value));
}

// ---------------------------------------------------------------
// SALIDAS (KIZEO) — acepta tanto la planilla de carga masiva por centro de
// costo como la planilla individual producto por producto; ambas traen el
// mismo "nombre completo" del producto, solo cambian los nombres de columna.
// ---------------------------------------------------------------
function renderSalidas(main){
  const panel = el(`<div class="panel">
    <h2>Importar archivo de Kizeo</h2>
    <div class="row">
      <input type="file" id="kizeoFile" accept=".xlsx,.xls,.csv">
      <button class="btn" id="kizeoImport">Importar y mapear</button>
    </div>
    <div class="hint">Funciona con la planilla de "carga masiva por centro de costo" y con la planilla "individual producto por producto" — el sistema detecta las columnas automáticamente en ambos formatos.</div>
    <div id="kizeoResult"></div>
  </div>`);
  main.appendChild(panel);

  panel.querySelector('#kizeoImport').onclick = ()=>{
    const file = panel.querySelector('#kizeoFile').files[0];
    if(!file){ alert('Selecciona un archivo primero'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      let mapeadas=0, pendientes=0;
      rows.forEach(r=>{
        const fecha = parseFecha(get(r,'Fecha de respuesta','Fecha del pedido','Fecha y hora de Despacho','Fecha'));
        const nombreTxt = get(r,'Uniforme y Epp','Producto','Descriptor','Nombre_Completo').toString().trim();
        const cantidad = Number(get(r,'Cantidad','EPP#Cantidad','EPP_Cantidad')||0);
        let persona = get(r,'Solicitud de:','Solicitud de','Nombre2','Persona').toString().trim();
        if(!persona){
          const nom = get(r,'Nombre').toString().trim();
          const ape = get(r,'Apellidos').toString().trim();
          persona = [nom,ape].filter(Boolean).join(' ');
        }
        const centroCosto = get(r,'Centro de Costo','Centro_Costo').toString().trim();
        const tipoSolicitud = get(r,'Tipo de Solicitud','EPP#Cantidad3','EPP_Cantidad3').toString().trim();
        if(!nombreTxt || cantidad<=0) return;
        const sku = resolveSkuByNombre(nombreTxt);
        DB.salidas.push({
          id: uid(), fecha, sku, nombreCompleto: nombreTxt, cantidad, persona, centroCosto, tipoSolicitud,
          estado: sku ? 'mapeado' : 'pendiente'
        });
        sku ? mapeadas++ : pendientes++;
      });
      save('salidas');
      panel.querySelector('#kizeoResult').innerHTML = `<div class="hint">Importación completa: ${mapeadas} filas mapeadas automáticamente, ${pendientes} pendientes de revisión.</div>`;
      render();
    };
    reader.readAsArrayBuffer(file);
  };

  const pendientes = DB.salidas.filter(s=>s.estado==='pendiente');
  if(pendientes.length){
    const skuOptions = DB.maestro.map(m=>`<option value="${escapeHtml(m.sku)}">${escapeHtml(m.sku)} - ${escapeHtml(m.nombreCompleto)}</option>`).join('');
    const pendPanel = el(`<div class="panel">
      <h2>Pendientes de mapeo (${pendientes.length})</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Producto Kizeo</th><th>Cantidad</th><th>Asignar producto</th></tr></thead>
        <tbody id="pendBody"></tbody>
      </table></div>
    </div>`);
    main.appendChild(pendPanel);
    const tbody = pendPanel.querySelector('#pendBody');
    pendientes.forEach(s=>{
      tbody.appendChild(el(`<tr>
        <td>${fFecha(s.fecha)}</td><td>${escapeHtml(s.nombreCompleto)}</td><td>${s.cantidad}</td>
        <td><select data-id="${s.id}"><option value="">Seleccionar producto...</option>${skuOptions}</select></td>
      </tr>`));
    });
    tbody.querySelectorAll('select[data-id]').forEach(sel=>{
      sel.onchange = ()=>{
        const s = DB.salidas.find(x=>x.id===sel.dataset.id);
        s.sku = sel.value; s.estado='manual';
        guardarAlias(s.nombreCompleto, sel.value);
        save('salidas'); save('alias'); render();
      };
    });
  }

  // Resumen por producto: cuánto ha salido de cada uno, sin mostrar cada
  // movimiento individual ni el estado de mapeo (según lo pediste).
  const resumenPanel = el(`<div class="panel">
    <h2>Productos con salidas registradas</h2>
    <div class="row"><input class="search" id="salSearch" placeholder="Buscar por producto, SKU o proveedor..."></div>
    <div id="salList"></div>
  </div>`);
  main.appendChild(resumenPanel);

  function fillSalidas(filter){
    const list = resumenPanel.querySelector('#salList');
    list.innerHTML='';
    const f = norm(filter);
    const grupos = {};
    DB.salidas.forEach(s=>{
      if(!s.sku) return; // los pendientes de mapeo no cuentan como "cargados" todavía
      if(!grupos[s.sku]) grupos[s.sku] = {sku:s.sku, total:0, movimientos:0, ultima:''};
      grupos[s.sku].total += Number(s.cantidad);
      grupos[s.sku].movimientos += 1;
      if(!grupos[s.sku].ultima || s.fecha > grupos[s.sku].ultima) grupos[s.sku].ultima = s.fecha;
    });
    let filas = Object.values(grupos).map(g=>({...g, m: getProducto(g.sku)}));
    filas = filas.filter(g=>{
      if(!f) return true;
      return norm(g.sku).includes(f) || norm(g.m?productoLabel(g.m):'').includes(f) || norm(g.m?.proveedor).includes(f);
    });
    filas.sort((a,b)=>b.total-a.total);
    if(!filas.length){
      list.appendChild(el(`<div class="hint">Todavía no hay salidas cargadas con producto asignado.</div>`));
    }
    filas.forEach(g=>{
      list.appendChild(el(`<div class="list-row">
        <div class="list-main">
          <div class="list-title">${escapeHtml(g.m?productoLabel(g.m):g.sku)} ${g.m&&g.m.talla?`<span class="chip">${escapeHtml(g.m.talla)}</span>`:''}</div>
          <div class="list-meta">SKU ${escapeHtml(g.sku)}${g.m&&g.m.proveedor?(' · Proveedor: '+escapeHtml(g.m.proveedor)):''} · ${g.movimientos} movimiento(s) · Última salida: ${fFecha(g.ultima)}</div>
        </div>
        <div class="list-side">
          <span class="list-qty" style="color:var(--red)">-${g.total}</span>
        </div>
      </div>`));
    });
  }
  fillSalidas('');
  resumenPanel.querySelector('#salSearch').addEventListener('input', e=>fillSalidas(e.target.value));
}

// CORTE HISTÓRICO
// ---------------------------------------------------------------
function renderCorte(main){
  const panel = el(`<div class="panel">
    <h2>Generar corte histórico</h2>
    <div class="row">
      <div class="field"><label>Fecha inicio</label><input type="date" id="cIni" lang="es-CL"></div>
      <div class="field"><label>Fecha fin</label><input type="date" id="cFin" lang="es-CL"></div>
      <div class="field"><label>Nombre del corte</label><input id="cNombre" placeholder="Ej: Corte Agosto 2026"></div>
      <button class="btn" id="cGenerar" style="align-self:flex-end;">Generar corte</button>
    </div>
    <div class="hint">El corte compara el stock físico al inicio del período contra las entradas y salidas registradas dentro de ese rango, y calcula el stock actual al final del período para cada producto.</div>
  </div>`);
  main.appendChild(panel);

  panel.querySelector('#cGenerar').onclick = ()=>{
    const fi = panel.querySelector('#cIni').value;
    const ff = panel.querySelector('#cFin').value;
    const nombre = panel.querySelector('#cNombre').value.trim() || `Corte ${fi} a ${ff}`;
    if(!fi || !ff || ff<fi){ alert('Verifica el rango de fechas'); return; }
    const detalle = DB.maestro.map(m=>{
      const stockInicial = stockAntesDe(m.sku, fi);
      const entradasPeriodo = DB.entradas.filter(e=>e.sku===m.sku && e.fecha>=fi && e.fecha<=ff).reduce((a,e)=>a+Number(e.cantidad),0);
      const salidasPeriodo = DB.salidas.filter(s=>s.sku===m.sku && s.fecha>=fi && s.fecha<=ff).reduce((a,s)=>a+Number(s.cantidad),0);
      const stockTeorico = stockInicial + entradasPeriodo - salidasPeriodo;
      return {sku:m.sku, stockInicial, entradasPeriodo, salidasPeriodo, stockTeorico};
    });
    const corte = {id: uid(), fechaInicio:fi, fechaFin:ff, nombre, detalle};
    DB.cortes.push(corte);
    save('cortes');
    currentCorteId = corte.id;
    render();
  };

  if(DB.cortes.length){
    const opciones = [...DB.cortes].reverse().map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)} (${fFecha(c.fechaInicio)} → ${fFecha(c.fechaFin)})</option>`).join('');
    const selPanel = el(`<div class="panel">
      <div class="row">
        <div class="field" style="flex:1;min-width:220px;"><label>Ver corte guardado</label><select id="corteSelect">${opciones}</select></div>
        <button class="btn secondary" id="expCorte" style="align-self:flex-end;">Exportar Excel</button>
        <button class="btn danger" id="delCorte" style="align-self:flex-end;">Eliminar este corte</button>
      </div>
      <div class="cards" id="corteResumen"></div>
      <div class="row">
        <input class="search" id="corteSearch" placeholder="Buscar por SKU, producto o proveedor...">
        <select id="corteFiltro" style="min-width:200px;">
          <option value="todos">Ver todos los productos</option>
          <option value="movimiento">Solo con entradas o salidas</option>
          <option value="critico">Solo en stock crítico al cierre</option>
        </select>
        <select id="corteOrden" style="min-width:190px;">
          <option value="nombre">Ordenar por nombre</option>
          <option value="diferencia">Ordenar por diferencia</option>
          <option value="stockFinal">Ordenar por stock final</option>
        </select>
      </div>
      <div class="hint">Detalle producto por producto: stock físico al inicio del período, entradas y salidas registradas dentro del rango, la diferencia entre ambas y el stock final resultante.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>SKU</th><th>Producto</th><th>Talla</th><th>Proveedor</th><th>Stock inicial</th><th>Entradas</th><th>Salidas</th><th>Diferencia</th><th>Stock final</th><th>Valor final</th></tr></thead>
        <tbody id="corteBody"></tbody>
      </table></div>
    </div>`);
    main.appendChild(selPanel);

    function fillCorte(id){
      const corte = DB.cortes.find(c=>c.id===id);
      if(!corte) return;
      const filtro = selPanel.querySelector('#corteFiltro').value;
      const orden = selPanel.querySelector('#corteOrden').value;
      const f = norm(selPanel.querySelector('#corteSearch').value);
      const tbody = selPanel.querySelector('#corteBody');
      tbody.innerHTML='';
      let tIni=0, tEnt=0, tSal=0, tFin=0, valorFin=0;
      let filas = corte.detalle.map(d=>{
        const m = getProducto(d.sku);
        tIni+=d.stockInicial; tEnt+=d.entradasPeriodo; tSal+=d.salidasPeriodo; tFin+=d.stockTeorico;
        const valor = d.stockTeorico * Number(m?.precioNeto||0);
        valorFin += valor;
        return {d, m, diferencia: d.entradasPeriodo - d.salidasPeriodo, valor};
      });
      filas = filas.filter(({d,m})=>{
        if(filtro==='movimiento' && d.entradasPeriodo===0 && d.salidasPeriodo===0) return false;
        if(filtro==='critico' && !(d.stockTeorico<=Number(m?.stockCritico||0))) return false;
        if(f && !(norm(d.sku).includes(f) || norm(m?productoLabel(m):'').includes(f) || norm(m?.proveedor).includes(f))) return false;
        return true;
      });
      if(orden==='diferencia') filas.sort((a,b)=>a.diferencia-b.diferencia);
      else if(orden==='stockFinal') filas.sort((a,b)=>a.d.stockTeorico-b.d.stockTeorico);
      else filas.sort((a,b)=>norm(a.m?productoLabel(a.m):'').localeCompare(norm(b.m?productoLabel(b.m):'')));

      filas.forEach(({d,m,diferencia,valor})=>{
        const critico = m && d.stockTeorico<=Number(m.stockCritico||0);
        tbody.appendChild(el(`<tr class="${critico?'row-faltante':''}">
          <td data-label="SKU">${escapeHtml(d.sku)}</td><td data-label="Producto">${escapeHtml(m?productoLabel(m):'')}</td><td data-label="Talla">${escapeHtml(m?tallaLabel(m):'—')}</td><td data-label="Proveedor">${escapeHtml(m?m.proveedor:'')}</td>
          <td data-label="Stock inicial">${d.stockInicial}</td><td data-label="Entradas" style="color:var(--green)">+${d.entradasPeriodo}</td><td data-label="Salidas" style="color:var(--red)">-${d.salidasPeriodo}</td>
          <td data-label="Diferencia" style="font-weight:700;color:${diferencia>=0?'var(--green)':'var(--red)'}">${diferencia>=0?'+':''}${diferencia}</td>
          <td data-label="Stock final"><strong>${d.stockTeorico}</strong>${critico?' <span class="badge critico">Crítico</span>':''}</td>
          <td data-label="Valor final">${fmtMoney(valor)}</td>
        </tr>`));
      });
      if(!filas.length){
        tbody.appendChild(el(`<tr><td colspan="10" style="text-align:center;color:var(--text-secondary);">No hay productos que coincidan con el filtro.</td></tr>`));
      }
      selPanel.querySelector('#corteResumen').innerHTML = `
        <div class="card"><div class="label">Stock inicial total (${fFecha(corte.fechaInicio)})</div><div class="value">${tIni}</div></div>
        <div class="card"><div class="label">Entradas del período</div><div class="value" style="color:var(--green)">+${tEnt}</div></div>
        <div class="card"><div class="label">Salidas del período</div><div class="value" style="color:var(--red)">-${tSal}</div></div>
        <div class="card"><div class="label">Stock final (${fFecha(corte.fechaFin)})</div><div class="value">${tFin}</div></div>
        <div class="card"><div class="label">Valorizado stock final</div><div class="value">${fmtMoney(valorFin)}</div></div>
      `;
      selPanel.querySelector('#expCorte').onclick = ()=>{
        const data = corte.detalle.map(d=>{
          const m = getProducto(d.sku);
          return {SKU:d.sku, Producto:m?productoLabel(m):'', Talla:m?m.talla:'', Proveedor:m?m.proveedor:'', Stock_Inicial:d.stockInicial, Entradas_Periodo:d.entradasPeriodo, Salidas_Periodo:d.salidasPeriodo, Diferencia:d.entradasPeriodo-d.salidasPeriodo, Stock_Final:d.stockTeorico, Valor_Final: d.stockTeorico*Number(m?.precioNeto||0)};
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Corte');
        XLSX.writeFile(wb, corte.nombre.replace(/\s+/g,'_')+'.xlsx');
      };
      selPanel.querySelector('#delCorte').onclick = ()=>{
        if(!confirm(`¿Eliminar el corte "${corte.nombre}"? También se borrará el conteo físico asociado a él, si existe.`)) return;
        DB.cortes = DB.cortes.filter(c=>c.id!==corte.id);
        delete DB.conteos[corte.id];
        save('cortes'); save('conteos');
        currentCorteId = null;
        render();
      };
    }
    const defaultId = currentCorteId && DB.cortes.some(c=>c.id===currentCorteId) ? currentCorteId : DB.cortes[DB.cortes.length-1].id;
    selPanel.querySelector('#corteSelect').value = defaultId;
    fillCorte(defaultId);
    selPanel.querySelector('#corteSelect').addEventListener('change', e=>{ currentCorteId=e.target.value; fillCorte(e.target.value); });
    selPanel.querySelector('#corteFiltro').addEventListener('change', ()=>fillCorte(selPanel.querySelector('#corteSelect').value));
    selPanel.querySelector('#corteOrden').addEventListener('change', ()=>fillCorte(selPanel.querySelector('#corteSelect').value));
    selPanel.querySelector('#corteSearch').addEventListener('input', ()=>fillCorte(selPanel.querySelector('#corteSelect').value));
  }
}

// CONTEO FÍSICO
// ---------------------------------------------------------------
function renderConteo(main){
  if(!DB.cortes.length){
    main.appendChild(el('<div class="panel"><h2>Conteo físico</h2><div class="hint">Primero genera un corte en la pestaña "Corte histórico" — el conteo físico siempre se hace sobre un corte.</div></div>'));
    return;
  }
  const opciones = [...DB.cortes].reverse().map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)} (${fFecha(c.fechaInicio)} → ${fFecha(c.fechaFin)})</option>`).join('');
  const panel = el(`<div class="panel">
    <h2>Conteo físico</h2>
    <div class="row" style="align-items:stretch;">
      <div style="flex:1;min-width:260px;background:var(--steel-pale);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;">
        <strong>¿Para qué sirve esta pestaña?</strong><br>
        Es para verificar que lo que el sistema calcula (según las entradas y salidas registradas) coincide con lo que realmente hay en bodega cuando cuentas físicamente.
        <ol style="margin:8px 0 0 18px;padding:0;">
          <li>Elige el corte que quieres verificar abajo.</li>
          <li>Ve producto por producto y escribe en "Cantidad contada" lo que contaste físicamente.</li>
          <li>El sistema calcula solo la "Diferencia" (contado − lo que debería haber). Si hay diferencia, escribe el motivo en "Observación" (ej: "se traspasó a otra bodega", "producto dañado", "no se registró la entrada a tiempo").</li>
          <li>Cuando termines, usa el botón <strong>"Aplicar diferencias al inventario"</strong> más abajo: eso corrige el stock del sistema para que quede igual a lo contado (crea automáticamente un movimiento de ajuste por cada diferencia).</li>
        </ol>
      </div>
      <div class="field" style="flex:1;min-width:220px;"><label>Corte a verificar</label><select id="conCorteSel">${opciones}</select></div>
    </div>
    <div id="conteoStats" class="cards"></div>
    <div class="row"><input class="search" id="conSearch" placeholder="Buscar producto o SKU..."></div>
    <div class="table-wrap"><table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Talla</th><th>Stock que debería haber</th><th>Cantidad contada</th><th>Diferencia</th><th>Estado</th><th>Observación (obligatoria si hay diferencia)</th></tr></thead>
      <tbody id="conBody"></tbody>
    </table></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="conAplicar">📦 Aplicar diferencias al inventario (cuadrar stock)</button>
      <span class="hint" id="conAplicarHint" style="margin:0;"></span>
    </div>
  </div>`);
  main.appendChild(panel);

  function fill(corteId){
    const corte = DB.cortes.find(c=>c.id===corteId);
    if(!corte) return;
    if(!DB.conteos[corteId]) DB.conteos[corteId] = [];
    const conteos = DB.conteos[corteId];
    const f = norm(panel.querySelector('#conSearch') ? panel.querySelector('#conSearch').value : '');
    const tbody = panel.querySelector('#conBody');
    tbody.innerHTML='';
    let faltantes=0, sobrantes=0, cuadrados=0, sinContar=0, criticos=0, pendientesAplicar=0;
    corte.detalle.forEach(d=>{
      const m = getProducto(d.sku);
      if(f && !(norm(d.sku).includes(f) || norm(m?productoLabel(m):'').includes(f))) return;
      const registro = conteos.find(c=>c.sku===d.sku);
      const tieneConteo = registro && registro.cantidadFisica!==undefined && registro.cantidadFisica!=='';
      let diferencia=null, estado='sin_contar', rowClass='';
      if(tieneConteo){
        diferencia = Number(registro.cantidadFisica) - d.stockTeorico;
        if(diferencia<0){estado='faltante';faltantes++;rowClass='row-faltante';}
        else if(diferencia>0){estado='sobrante';sobrantes++;rowClass='row-sobrante';}
        else {estado='cuadrado';cuadrados++;rowClass='row-cuadrado';}
      } else sinContar++;
      const faltaObs = diferencia!==null && diferencia!==0 && !(registro && registro.causa && registro.causa.trim());
      const yaAplicado = registro && registro.aplicado;
      if(diferencia!==null && diferencia!==0 && !yaAplicado && !faltaObs) pendientesAplicar++;
      const esCritico = m && d.stockTeorico<=Number(m.stockCritico||0);
      if(esCritico) criticos++;
      const tr = el(`<tr class="${rowClass}">
        <td data-label="SKU">${escapeHtml(d.sku)}</td>
        <td data-label="Producto">${escapeHtml(m?productoLabel(m):'')} ${esCritico?'<span class="badge critico">Crítico</span>':''}</td>
        <td data-label="Talla">${escapeHtml(m?tallaLabel(m):'—')}</td>
        <td data-label="Stock que debería haber">${d.stockTeorico}</td>
        <td data-label="Cantidad contada"><input class="count-input" type="number" data-sku="${escapeHtml(d.sku)}" value="${tieneConteo?registro.cantidadFisica:''}" placeholder="—" ${yaAplicado?'disabled':''}></td>
        <td data-label="Diferencia">${diferencia===null?'—':(diferencia>0?'+'+diferencia:diferencia)}</td>
        <td data-label="Estado">${yaAplicado?'<span class="badge mapeado">✓ aplicado</span>':(estado==='sin_contar'?'<span class="badge pendiente">sin contar</span>':`<span class="badge ${estado}">${estado}</span>`)}</td>
        <td data-label="Observación"><input type="text" data-obs="${escapeHtml(d.sku)}" style="width:100%;border-color:${faltaObs?'var(--red)':'var(--border)'};" value="${escapeHtml(registro?registro.causa:'')}" placeholder="${faltaObs?'⚠ Escribe el motivo de la diferencia':'Sin diferencia'}" ${yaAplicado?'disabled':''}></td>
      </tr>`);
      tbody.appendChild(tr);
    });
    if(!tbody.children.length){
      tbody.appendChild(el(`<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);">No hay productos que coincidan con la búsqueda.</td></tr>`));
    }
    panel.querySelector('#conteoStats').innerHTML = `
      <div class="card"><div class="label">Sin contar todavía</div><div class="value">${sinContar}</div></div>
      <div class="card"><div class="label">Cuadrados</div><div class="value" style="color:var(--green)">${cuadrados}</div></div>
      <div class="card ${faltantes>0?'alert':''}"><div class="label">Faltantes</div><div class="value" style="color:var(--red)">${faltantes}</div></div>
      <div class="card"><div class="label">Sobrantes</div><div class="value" style="color:var(--amber)">${sobrantes}</div></div>
    `;
    const aplicarBtn = panel.querySelector('#conAplicar');
    const aplicarHint = panel.querySelector('#conAplicarHint');
    aplicarBtn.disabled = pendientesAplicar===0;
    aplicarBtn.style.opacity = pendientesAplicar===0 ? '0.5' : '1';
    aplicarHint.textContent = pendientesAplicar>0
      ? `${pendientesAplicar} producto(s) con diferencia lista(s) para aplicar.`
      : 'No hay diferencias pendientes de aplicar (o falta escribir la observación de alguna).';

    tbody.querySelectorAll('input[data-sku]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const sku = inp.dataset.sku;
        const val = inp.value;
        const obsInput = tbody.querySelector(`input[data-obs="${CSS.escape(sku)}"]`);
        let registro = conteos.find(c=>c.sku===sku);
        if(!registro){ registro={sku, cantidadFisica:val, causa:obsInput.value.trim(), fecha:new Date().toISOString(), aplicado:false}; conteos.push(registro); }
        else { registro.cantidadFisica = val; registro.fecha = new Date().toISOString(); }
        save('conteos');
        fill(corteId);
      });
    });
    tbody.querySelectorAll('input[data-obs]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const sku = inp.dataset.obs;
        let registro = conteos.find(c=>c.sku===sku);
        if(!registro){ registro={sku, cantidadFisica:'', causa:inp.value.trim(), fecha:new Date().toISOString(), aplicado:false}; conteos.push(registro); }
        else registro.causa = inp.value.trim();
        save('conteos');
        fill(corteId);
      });
    });

    aplicarBtn.onclick = ()=>{
      const aAplicar = corte.detalle.map(d=>{
        const registro = conteos.find(c=>c.sku===d.sku);
        if(!registro || registro.cantidadFisica===undefined || registro.cantidadFisica==='' || registro.aplicado) return null;
        const diferencia = Number(registro.cantidadFisica) - d.stockTeorico;
        if(diferencia===0 || !registro.causa || !registro.causa.trim()) return null;
        return {d, registro, diferencia};
      }).filter(Boolean);
      if(!aAplicar.length){ alert('No hay diferencias pendientes de aplicar.'); return; }
      const resumen = aAplicar.map(x=>{
        const m = getProducto(x.d.sku);
        return `${x.diferencia>0?'+':''}${x.diferencia} · ${m?productoLabel(m):x.d.sku}`;
      }).join('\n');
      if(!confirm(`Se van a crear ${aAplicar.length} movimiento(s) de ajuste para que el stock del sistema quede igual a lo contado:\n\n${resumen}\n\n¿Continuar?`)) return;
      const fechaAjuste = todayStr();
      aAplicar.forEach(({d,registro,diferencia})=>{
        const m = getProducto(d.sku);
        if(diferencia>0){
          DB.entradas.push({id:uid(), fecha:fechaAjuste, sku:d.sku, nombreCompleto: m?m.nombreCompleto:d.sku, cantidad:diferencia, proveedor:'Ajuste por conteo físico', factura:'', observaciones:'Ajuste por conteo físico: '+registro.causa});
        } else {
          DB.salidas.push({id:uid(), fecha:fechaAjuste, sku:d.sku, nombreCompleto: m?m.nombreCompleto:d.sku, cantidad:Math.abs(diferencia), persona:'Ajuste por conteo físico', centroCosto:'', tipoSolicitud:'Ajuste: '+registro.causa, estado:'manual'});
        }
        registro.aplicado = true;
      });
      save('conteos'); save('entradas'); save('salidas');
      render();
    };
  }
  const defaultId = DB.cortes[DB.cortes.length-1].id;
  panel.querySelector('#conCorteSel').value = defaultId;
  fill(defaultId);
  panel.querySelector('#conSearch').addEventListener('input', ()=>fill(panel.querySelector('#conCorteSel').value));
  panel.querySelector('#conCorteSel').addEventListener('change', e=>fill(e.target.value));
}

// ---------------------------------------------------------------
// INIT
// ---------------------------------------------------------------
(async function init(){
  await loadAll();
  document.getElementById('statusMsg').textContent = supabaseClient ? '🟢 Conectado a Supabase' : 'Datos cargados (almacenamiento de Claude)';
  render();
})();
</script>
</body>
</html>
